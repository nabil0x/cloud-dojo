name: Greet first-time contributors
on: [pull_request_target, issues]
permissions:
  issues: write
  pull-requests: write
jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Welcome to the dojo! Thanks for opening your first issue.
            Please include the quest ID, your command, and full output —
            see SUPPORT.md for the format that gets answers fastest.
          pr-message: >
            Welcome, contributor! Thanks for your first PR.
            Please confirm: no real credentials, no billable resources left
            running, and Done-check evidence pasted in the description.
