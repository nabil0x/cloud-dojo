name: Validate course
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # weekly link patrol
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Course integrity (quests, XP, badges, local links)
        run: python3 shared/validate_course.py
      - name: External link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress **/*.md
          fail: true
